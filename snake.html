<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #4ecca3;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #scoreboard {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
      font-size: 1rem;
      color: #aaa;
    }

    #scoreboard span {
      font-weight: bold;
      color: #4ecca3;
    }

    #canvas-wrapper {
      position: relative;
      border: 3px solid #4ecca3;
      border-radius: 6px;
      box-shadow: 0 0 30px #4ecca366;
    }

    canvas {
      display: block;
      background: #16213e;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(22, 33, 62, 0.88);
      border-radius: 4px;
    }

    #overlay h2 {
      font-size: 2rem;
      color: #e94560;
      margin-bottom: 8px;
    }

    #overlay p {
      color: #aaa;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    #overlay button {
      padding: 12px 32px;
      font-size: 1rem;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      transition: background 0.2s;
    }

    #overlay button:hover { background: #38b28a; }

    #controls {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>Snake</h1>

<div id="scoreboard">
  Score : <span id="score">0</span>
  &nbsp;&nbsp;|&nbsp;&nbsp;
  Meilleur : <span id="best">0</span>
</div>

<div id="canvas-wrapper">
  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="overlay">
    <h2 id="overlay-title">Snake</h2>
    <p id="overlay-msg">Utilisez les flèches ou ZQSD pour jouer</p>
    <button id="btn">Jouer</button>
  </div>
</div>

<div id="controls">
  Flèches directionnelles &nbsp;/&nbsp; Z Q S D &nbsp;/&nbsp; W A S D
</div>

<script>
  const canvas  = document.getElementById('canvas');
  const ctx     = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('overlay-title');
  const msgEl   = document.getElementById('overlay-msg');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const btn     = document.getElementById('btn');

  const COLS = 20, ROWS = 20;
  const CELL = canvas.width / COLS;

  // Vitesse en ms : diminue quand le score augmente
  function getDelay(sc) { return Math.max(70, 150 - sc * 4); }

  let snake, dir, nextDir, food, score, best, intervalId;

  // localStorage protégé contre les erreurs (iframe, mode privé…)
  function lsGet(k)    { try { return localStorage.getItem(k); }    catch(e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); }        catch(e) {} }

  best = parseInt(lsGet('snakeBest') || '0');
  bestEl.textContent = best;

  // ── Utilitaires ──────────────────────────────────────────────
  function rand(max) { return Math.floor(Math.random() * max); }

  function placeFood() {
    let pos;
    do { pos = { x: rand(COLS), y: rand(ROWS) }; }
    while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function init() {
    snake   = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir     = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score   = 0;
    scoreEl.textContent = 0;
    placeFood();
  }

  // ── Boucle de jeu ────────────────────────────────────────────
  function step() {
    dir = { ...nextDir };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Collision murs
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }
    // Collision soi-même
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        lsSet('snakeBest', best);
      }
      placeFood();
      // Réinitialiser l'intervalle avec la nouvelle vitesse
      clearInterval(intervalId);
      intervalId = setInterval(step, getDelay(score));
    } else {
      snake.pop();
    }

    draw();
  }

  // ── Rendu ────────────────────────────────────────────────────
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grille subtile
    ctx.strokeStyle = '#1c2a4a';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
    }

    // Nourriture
    ctx.fillStyle = '#e94560';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // Serpent
    snake.forEach((seg, i) => {
      const t = i / snake.length;
      const r = Math.round(78  - t * 40);
      const g = Math.round(204 - t * 60);
      const b = Math.round(163 - t * 50);
      ctx.fillStyle = `rgb(${r},${g},${b})`;

      const x = seg.x * CELL + 1, y = seg.y * CELL + 1, s = CELL - 2;
      if (i === 0) {
        // Tête avec coins arrondis
        const radius = 5;
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + s - radius, y);
        ctx.quadraticCurveTo(x + s, y, x + s, y + radius);
        ctx.lineTo(x + s, y + s - radius);
        ctx.quadraticCurveTo(x + s, y + s, x + s - radius, y + s);
        ctx.lineTo(x + radius, y + s);
        ctx.quadraticCurveTo(x, y + s, x, y + s - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(x, y, s, s);
      }
    });
  }

  // ── Game over / démarrage ─────────────────────────────────────
  function gameOver() {
    clearInterval(intervalId);
    intervalId = null;
    titleEl.textContent   = 'Game Over';
    titleEl.style.color   = '#e94560';
    msgEl.textContent     = `Score : ${score}`;
    btn.textContent       = 'Rejouer';
    overlay.style.display = 'flex';
  }

  function startGame() {
    clearInterval(intervalId);
    overlay.style.display = 'none';
    init();
    draw();
    intervalId = setInterval(step, getDelay(score));
  }

  btn.addEventListener('click', startGame);

  // ── Contrôles clavier ─────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (!intervalId) return; // jeu non démarré
    const map = {
      ArrowUp:    { x: 0, y:-1 }, ArrowDown:  { x: 0, y: 1 },
      ArrowLeft:  { x:-1, y: 0 }, ArrowRight: { x: 1, y: 0 },
      z:{ x:0,y:-1 }, Z:{ x:0,y:-1 }, w:{ x:0,y:-1 }, W:{ x:0,y:-1 },
      s:{ x:0,y: 1 }, S:{ x:0,y: 1 },
      q:{ x:-1,y:0 }, Q:{ x:-1,y:0 }, a:{ x:-1,y:0 }, A:{ x:-1,y:0 },
      d:{ x: 1,y:0 }, D:{ x: 1,y:0 },
    };
    const nd = map[e.key];
    if (!nd) return;
    e.preventDefault();
    if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
  });
</script>
</body>
</html>

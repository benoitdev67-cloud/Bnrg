<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Snake 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  #canvas { display: block; }
  #ui {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 40px; align-items: center;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(0,255,150,0.3);
    border-radius: 12px; padding: 12px 30px;
    backdrop-filter: blur(8px);
  }
  .stat { text-align: center; }
  .stat-label { color: #888; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
  .stat-value { color: #00ff96; font-size: 28px; font-weight: 700; }
  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
    z-index: 10;
  }
  #overlay h1 {
    font-size: 72px; font-weight: 900;
    background: linear-gradient(135deg, #00ff96, #00cfff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  #overlay p { color: #aaa; font-size: 18px; margin-bottom: 8px; }
  #overlay .controls { color: #666; font-size: 14px; margin-bottom: 40px; text-align: center; line-height: 2; }
  #startBtn {
    background: linear-gradient(135deg, #00ff96, #00cfff);
    border: none; border-radius: 10px; padding: 14px 50px;
    font-size: 18px; font-weight: 700; color: #000; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 30px rgba(0,255,150,0.4);
  }
  #startBtn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(0,255,150,0.6); }
  #gameOver {
    position: fixed; inset: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
    z-index: 10;
  }
  #gameOver h2 {
    font-size: 60px; font-weight: 900;
    background: linear-gradient(135deg, #ff4466, #ff9900);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
  }
  #finalScore { color: #00ff96; font-size: 32px; margin-bottom: 8px; }
  #bestScore  { color: #888; font-size: 18px; margin-bottom: 40px; }
  #restartBtn {
    background: linear-gradient(135deg, #ff4466, #ff9900);
    border: none; border-radius: 10px; padding: 14px 50px;
    font-size: 18px; font-weight: 700; color: #fff; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 30px rgba(255,68,102,0.4);
  }
  #restartBtn:hover { transform: scale(1.05); }
  #speedLabel { color: #ffcc00; font-size: 13px; text-align: center; margin-top: 4px; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="ui">
  <div class="stat">
    <div class="stat-label">Score</div>
    <div class="stat-value" id="scoreDisplay">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Meilleur</div>
    <div class="stat-value" id="bestDisplay">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Niveau</div>
    <div class="stat-value" id="levelDisplay">1</div>
    <div id="speedLabel">Vitesse x1</div>
  </div>
</div>

<div id="overlay">
  <h1>SNAKE 3D</h1>
  <p style="color:#00ff96; font-size:22px; margin-bottom:20px;">Bienvenue dans la dimension serpent !</p>
  <div class="controls">
    <span style="color:#fff">Controles :</span><br>
    W / Z / ↑ &nbsp;&nbsp; Avancer<br>
    S / ↓ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Reculer<br>
    A / Q / ← &nbsp;&nbsp; Gauche<br>
    D / → &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Droite<br>
    Espace &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Monter<br>
    Shift &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Descendre
  </div>
  <button id="startBtn">Jouer</button>
</div>

<div id="gameOver">
  <h2>GAME OVER</h2>
  <div id="finalScore"></div>
  <div id="bestScore"></div>
  <button id="restartBtn">Rejouer</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const GRID = 20;          // grid size (GRID x GRID x GRID)
const CELL = 1.0;         // cell size
const HALF = (GRID * CELL) / 2 - CELL / 2;
const BASE_SPEED = 200;   // ms per step
const MIN_SPEED  = 70;

// ─── SCENE SETUP ──────────────────────────────────────────────────────────────
const canvas   = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x060614);

const scene  = new THREE.Scene();
scene.fog    = new THREE.FogExp2(0x060614, 0.025);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 22, 28);
camera.lookAt(0, 0, 0);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ─── LIGHTS ───────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x112244, 1.5));

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

const pLight1 = new THREE.PointLight(0x00ff96, 2, 40);
pLight1.position.set(-8, 8, 0);
scene.add(pLight1);

const pLight2 = new THREE.PointLight(0x00aaff, 1.5, 40);
pLight2.position.set(8, -8, 0);
scene.add(pLight2);

// ─── GRID BOX ─────────────────────────────────────────────────────────────────
const boxGeo = new THREE.BoxGeometry(GRID * CELL, GRID * CELL, GRID * CELL);
const boxMat = new THREE.MeshBasicMaterial({
  color: 0x00ff96, wireframe: true, transparent: true, opacity: 0.06
});
scene.add(new THREE.Mesh(boxGeo, boxMat));

// Grid floor dots
const dotGeo = new THREE.SphereGeometry(0.05, 6, 6);
const dotMat = new THREE.MeshBasicMaterial({ color: 0x223344 });
const floorY  = -HALF;
for (let x = 0; x < GRID; x++) {
  for (let z = 0; z < GRID; z++) {
    const d = new THREE.Mesh(dotGeo, dotMat);
    d.position.set(x * CELL - HALF, floorY, z * CELL - HALF);
    scene.add(d);
  }
}

// ─── MATERIALS ────────────────────────────────────────────────────────────────
const headMat = new THREE.MeshStandardMaterial({
  color: 0x00ff96, emissive: 0x00ff96, emissiveIntensity: 0.6,
  roughness: 0.3, metalness: 0.7
});
const bodyMat = new THREE.MeshStandardMaterial({
  color: 0x00cc77, emissive: 0x00cc77, emissiveIntensity: 0.2,
  roughness: 0.4, metalness: 0.6
});
const foodMat = new THREE.MeshStandardMaterial({
  color: 0xff4466, emissive: 0xff2244, emissiveIntensity: 0.8,
  roughness: 0.2, metalness: 0.8
});
const goldMat = new THREE.MeshStandardMaterial({
  color: 0xffcc00, emissive: 0xff9900, emissiveIntensity: 1.0,
  roughness: 0.1, metalness: 0.9
});

const segGeo  = new THREE.BoxGeometry(0.82, 0.82, 0.82);
const foodGeo = new THREE.SphereGeometry(0.45, 12, 12);
const goldGeo = new THREE.OctahedronGeometry(0.5, 0);

// ─── PARTICLES ────────────────────────────────────────────────────────────────
const partGeo  = new THREE.BufferGeometry();
const partCount = 200;
const partPos  = new Float32Array(partCount * 3);
for (let i = 0; i < partCount * 3; i++) partPos[i] = (Math.random() - 0.5) * 60;
partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
const partMat = new THREE.PointsMaterial({ color: 0x00ff96, size: 0.08, transparent: true, opacity: 0.4 });
scene.add(new THREE.Points(partGeo, partMat));

// ─── GAME STATE ───────────────────────────────────────────────────────────────
let snake, dir, nextDir, food, goldFood, score, best, level, speed, running;
let snakeMeshes = [], foodMesh = null, goldMesh = null;
let lastStep = 0, eatFlash = 0, deathAnim = 0;
let goldTimer = 0, goldActive = false;
let keys = {};

function gridPos(x, y, z) {
  return new THREE.Vector3(
    x * CELL - HALF,
    y * CELL - HALF,
    z * CELL - HALF
  );
}

function randomCell() {
  return {
    x: Math.floor(Math.random() * GRID),
    y: Math.floor(Math.random() * GRID),
    z: Math.floor(Math.random() * GRID)
  };
}

function cellEq(a, b) { return a.x === b.x && a.y === b.y && a.z === b.z; }

function spawnFood() {
  let pos;
  do { pos = randomCell(); }
  while (snake.some(s => cellEq(s, pos)) || (goldActive && cellEq(pos, goldFood)));
  food = pos;

  if (foodMesh) { scene.remove(foodMesh); foodMesh.geometry.dispose(); }
  foodMesh = new THREE.Mesh(foodGeo, foodMat);
  foodMesh.position.copy(gridPos(food.x, food.y, food.z));
  foodMesh.castShadow = true;
  scene.add(foodMesh);
}

function spawnGold() {
  let pos;
  do { pos = randomCell(); }
  while (snake.some(s => cellEq(s, pos)) || cellEq(pos, food));
  goldFood   = pos;
  goldActive = true;
  goldTimer  = 8000;

  if (goldMesh) { scene.remove(goldMesh); goldMesh.geometry.dispose(); }
  goldMesh = new THREE.Mesh(goldGeo, goldMat);
  goldMesh.position.copy(gridPos(goldFood.x, goldFood.y, goldFood.z));
  goldMesh.castShadow = true;
  scene.add(goldMesh);
}

function removeGold() {
  goldActive = false;
  if (goldMesh) { scene.remove(goldMesh); goldMesh = null; }
}

function clearMeshes() {
  snakeMeshes.forEach(m => scene.remove(m));
  snakeMeshes = [];
  if (foodMesh) { scene.remove(foodMesh); foodMesh = null; }
  removeGold();
}

function initGame() {
  clearMeshes();
  snake = [
    { x: 10, y: 10, z: 10 },
    { x:  9, y: 10, z: 10 },
    { x:  8, y: 10, z: 10 }
  ];
  dir     = { x: 1, y: 0, z: 0 };
  nextDir = { x: 1, y: 0, z: 0 };
  score   = 0; level = 1; speed = BASE_SPEED;
  eatFlash = 0; deathAnim = 0; goldActive = false; goldTimer = 0;
  updateUI();

  // Build initial meshes
  snake.forEach((seg, i) => {
    const m = new THREE.Mesh(segGeo, i === 0 ? headMat : bodyMat.clone());
    m.position.copy(gridPos(seg.x, seg.y, seg.z));
    m.castShadow = true;
    scene.add(m);
    snakeMeshes.push(m);
  });
  spawnFood();
}

function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('bestDisplay').textContent  = best || 0;
  document.getElementById('levelDisplay').textContent = level;
  document.getElementById('speedLabel').textContent   = `Vitesse x${level}`;
}

function step(ts) {
  if (!running) return;
  if (ts - lastStep < speed) return;
  lastStep = ts;

  // Apply direction
  dir = { ...nextDir };

  const head = snake[0];
  const newHead = {
    x: (head.x + dir.x + GRID) % GRID,
    y: (head.y + dir.y + GRID) % GRID,
    z: (head.z + dir.z + GRID) % GRID
  };

  // Self collision (skip head itself)
  if (snake.slice(1).some(s => cellEq(s, newHead))) {
    die(); return;
  }

  let grow = false;
  if (cellEq(newHead, food)) {
    grow = true; score += 10; eatFlash = 300;
    if (score % 50 === 0) { level++; speed = Math.max(MIN_SPEED, speed - 18); }
    updateUI(); spawnFood();
    if (score % 30 === 0 && !goldActive) spawnGold();
  }
  if (goldActive && cellEq(newHead, goldFood)) {
    grow = true; score += 30; eatFlash = 600;
    removeGold(); updateUI();
  }

  snake.unshift(newHead);
  if (!grow) snake.pop();

  // Rebuild meshes
  snakeMeshes.forEach(m => scene.remove(m));
  snakeMeshes = [];
  snake.forEach((seg, i) => {
    const mat = i === 0 ? headMat : bodyMat.clone();
    const t = i / snake.length;
    mat.color.setHSL(0.38 - t * 0.12, 1, 0.45);
    mat.emissive.setHSL(0.38 - t * 0.12, 1, 0.25);
    const m = new THREE.Mesh(segGeo, mat);
    m.position.copy(gridPos(seg.x, seg.y, seg.z));
    m.castShadow = true;
    scene.add(m);
    snakeMeshes.push(m);
  });
}

function die() {
  running = false;
  if (score > (best || 0)) best = score;
  document.getElementById('finalScore').textContent = `Score : ${score}`;
  document.getElementById('bestScore').textContent  = `Meilleur : ${best}`;
  document.getElementById('gameOver').style.display = 'flex';
  deathAnim = 600;
}

// ─── CAMERA FOLLOW ────────────────────────────────────────────────────────────
const camTarget = new THREE.Vector3();
function updateCamera() {
  if (!snake || !snake[0]) return;
  const h = gridPos(snake[0].x, snake[0].y, snake[0].z);
  camTarget.lerp(h, 0.04);
  camera.position.lerp(
    new THREE.Vector3(camTarget.x * 0.3, camTarget.y * 0.2 + 22, camTarget.z * 0.3 + 28),
    0.04
  );
  camera.lookAt(camTarget);
}

// ─── RENDER LOOP ──────────────────────────────────────────────────────────────
function animate(ts) {
  requestAnimationFrame(animate);

  // Particles drift
  const pp = partGeo.attributes.position.array;
  for (let i = 1; i < partCount * 3; i += 3) { pp[i] += 0.005; if (pp[i] > 30) pp[i] = -30; }
  partGeo.attributes.position.needsUpdate = true;

  // Food spin
  if (foodMesh) {
    foodMesh.rotation.x += 0.02;
    foodMesh.rotation.y += 0.03;
    const s = 1 + 0.1 * Math.sin(ts * 0.003);
    foodMesh.scale.setScalar(s);
  }
  if (goldMesh) {
    goldMesh.rotation.y += 0.06;
    goldMesh.rotation.z += 0.04;
  }

  // Gold timer
  if (goldActive && running) {
    goldTimer -= 16;
    if (goldTimer <= 0) removeGold();
  }

  // Eat flash (point light pulse)
  if (eatFlash > 0) {
    eatFlash -= 16;
    pLight1.intensity = 2 + 6 * (eatFlash / 300);
  } else {
    pLight1.intensity = 2;
  }

  // Point lights oscillate
  pLight1.position.x = Math.sin(ts * 0.001) * 10;
  pLight2.position.z = Math.cos(ts * 0.0013) * 10;

  // Head glow
  if (snakeMeshes[0]) {
    const scale = 1 + 0.05 * Math.sin(ts * 0.005);
    snakeMeshes[0].scale.setScalar(scale);
  }

  if (running) {
    handleInput();
    step(ts);
    updateCamera();
  }

  renderer.render(scene, camera);
}
animate(0);

// ─── INPUT ────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function handleInput() {
  // Up/forward: W, Z, ArrowUp
  if ((keys['KeyW'] || keys['KeyZ'] || keys['ArrowUp']) && dir.z !== 1)
    nextDir = { x: 0, y: 0, z: -1 };
  // Down/back: S, ArrowDown
  else if ((keys['KeyS'] || keys['ArrowDown']) && dir.z !== -1)
    nextDir = { x: 0, y: 0, z: 1 };
  // Left: A, Q, ArrowLeft
  else if ((keys['KeyA'] || keys['KeyQ'] || keys['ArrowLeft']) && dir.x !== 1)
    nextDir = { x: -1, y: 0, z: 0 };
  // Right: D, ArrowRight
  else if ((keys['KeyD'] || keys['ArrowRight']) && dir.x !== -1)
    nextDir = { x: 1, y: 0, z: 0 };
  // Up (Y axis): Space
  else if (keys['Space'] && dir.y !== -1)
    nextDir = { x: 0, y: 1, z: 0 };
  // Down (Y axis): Shift
  else if ((keys['ShiftLeft'] || keys['ShiftRight']) && dir.y !== 1)
    nextDir = { x: 0, y: -1, z: 0 };
}

// ─── BUTTONS ──────────────────────────────────────────────────────────────────
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('overlay').style.display = 'none';
  best = 0; initGame(); running = true;
});
document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('gameOver').style.display = 'none';
  initGame(); running = true;
});
</script>
</body>
</html>
